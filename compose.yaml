services:
  moirai:
    build: .
    container_name: moirai
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      MOIRAI_LOG_LEVEL: info
      MOIRAI_LOG_DIR: ${MOIRAI_LOG_DIR:-/data/logs}
      MOIRAI_LOG_RETENTION_DAYS: ${MOIRAI_LOG_RETENTION_DAYS:-14}
      MOIRAI_LOG_MAX_MB: ${MOIRAI_LOG_MAX_MB:-200}
      MOIRAI_LOG_FILE_MAX_MB: ${MOIRAI_LOG_FILE_MAX_MB:-10}
      MOIRAI_TIME_ZONE: ${MOIRAI_TIME_ZONE:-}
      MOIRAI_PUBLIC_URL: ${MOIRAI_PUBLIC_URL:-http://127.0.0.1:3000}
      MOIRAI_PLAYOUT_SYNC_INTERVAL_SECONDS: ${MOIRAI_PLAYOUT_SYNC_INTERVAL_SECONDS:-60}
      MOIRAI_PLAYBACK_READY_TIMEOUT_MS: ${MOIRAI_PLAYBACK_READY_TIMEOUT_MS:-30000}
      MOIRAI_PLAYBACK_STOP_GRACE_MS: ${MOIRAI_PLAYBACK_STOP_GRACE_MS:-5000}
      MOIRAI_ARTWORK_TRANSFORM_CONCURRENCY: ${MOIRAI_ARTWORK_TRANSFORM_CONCURRENCY:-4}
      MOIRAI_SCHEDULING_WORKERS: ${MOIRAI_SCHEDULING_WORKERS:-2}
      MOIRAI_SCHEDULING_WORKER_QUEUE: ${MOIRAI_SCHEDULING_WORKER_QUEUE:-32}
      MOIRAI_SCAN_CANCEL_GRACE_MS: ${MOIRAI_SCAN_CANCEL_GRACE_MS:-5000}
      MOIRAI_SHUTDOWN_DEADLINE_MS: ${MOIRAI_SHUTDOWN_DEADLINE_MS:-10000}
      MOIRAI_SCAN_HISTORY_RETENTION_DAYS: ${MOIRAI_SCAN_HISTORY_RETENTION_DAYS:-30}
      MOIRAI_SCAN_HISTORY_MAX_PER_LIBRARY: ${MOIRAI_SCAN_HISTORY_MAX_PER_LIBRARY:-2000}
    volumes:
      - moirai-data:/data
      # Add media libraries as read-only mounts, for example:
      # - /host/media/movies:/media/movies:ro

volumes:
  moirai-data:
